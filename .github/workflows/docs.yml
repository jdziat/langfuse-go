name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'hugo.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned, not 'latest': the hextra v0.11.1 theme's list.rss.xml uses
          # .Site.Author.email, which Hugo removed (>= ~0.156), so 'latest'
          # (0.162+) fails with "can't evaluate field Author in type page.Site".
          # 0.155.3 is verified to build the full site (incl. /tags RSS).
          # Bump in lockstep with the hextra theme version in go.mod.
          hugo-version: '0.155.3'
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build documentation
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
