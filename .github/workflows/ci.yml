name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce pkg/client coverage floor
        # Critical-path package (batching, async error handling, queue overflow,
        # shutdown). Measured cross-package so coverage driven from ./tests counts.
        # Floor is set well below current coverage to avoid flakiness; raise it
        # deliberately, never let it silently regress.
        run: |
          go test -covermode=atomic \
            -coverpkg=./pkg/client/... \
            -coverprofile=client_coverage.out \
            ./pkg/client/ ./tests/
          pct=$(go tool cover -func=client_coverage.out | awk '/^total:/ {sub(/%/,"",$3); print $3}')
          echo "pkg/client coverage: ${pct}%"
          awk -v p="$pct" -v floor=60 'BEGIN { if (p+0 < floor) { printf "FAIL: pkg/client coverage %.1f%% is below floor %d%%\n", p, floor; exit 1 } printf "OK: pkg/client coverage %.1f%% meets floor %d%%\n", p, floor }'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.go-version == '1.25.11'
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt
        run: |
          fmt_output=$(gofmt -l .)
          if [ -n "$fmt_output" ]; then
            echo "The following files are not formatted:"
            echo "$fmt_output"
            exit 1
          fi

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'

      - name: Build
        run: go build -v ./...

      - name: Build examples
        run: |
          go build -v ./examples/basic
          go build -v ./examples/advanced

  doc-snippets:
    name: Doc Snippets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'

      - name: Check documentation code snippets compile
        run: bash scripts/check-doc-snippets.sh

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.11'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -fmt json -out gosec-results.json ./... || true

      - name: Upload gosec results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gosec-results
          path: gosec-results.json
          retention-days: 30
